name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.distro }}
    runs-on: ubuntu-latest          # the host VM
    container: ${{ matrix.image }}  # the distro the job actually runs in
    strategy:
      fail-fast: false              # let the other distros finish when one fails
      matrix:
        include:
          - distro: ubuntu-24.04
            image: ubuntu:24.04
            install: apt-get update && apt-get install -y gcc make nasm
          - distro: debian-12
            image: debian:12
            install: apt-get update && apt-get install -y gcc make nasm
          - distro: fedora
            image: fedora:latest
            install: dnf install -y gcc make nasm findutils diffutils
          - distro: arch
            image: archlinux:latest
            install: pacman -Syu --noconfirm gcc make nasm diffutils
          - distro: alpine
            image: alpine:latest
            install: apk add gcc make nasm musl-dev bash coreutils

    steps:
      - name: Install toolchain
        run: ${{ matrix.install }}

      - uses: actions/checkout@v5

      - name: Build library and tests
        run: make all

      - name: Unit tests
        run: bash unit_tests.sh
